<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="900" viewBox="0 0 1440 900" direction="rtl">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#eef3f8"/>
      <stop offset="55%" stop-color="#f7f1ee"/>
      <stop offset="100%" stop-color="#e8f0f7"/>
    </linearGradient>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="16" flood-color="#1c2430" flood-opacity="0.08"/>
    </filter>
  </defs>
  <rect width="1440" height="900" fill="url(#bg)"/>
  <!-- sidebar -->
  <rect x="24" y="24" width="228" height="852" rx="28" fill="rgba(255,255,255,0.72)" stroke="#d7e0ea" filter="url(#soft)"/>
  <rect x="48" y="52" width="44" height="44" rx="14" fill="#e11d2e"/>
  <text x="70" y="80" text-anchor="middle" fill="#fff" font-family="Heebo, Arial, sans-serif" font-size="14" font-weight="700">ML</text>
  <text x="104" y="70" fill="#1c2430" font-family="Heebo, Arial, sans-serif" font-size="16" font-weight="700">MILO</text>
  <text x="104" y="90" fill="#8491a1" font-family="Heebo, Arial, sans-serif" font-size="11">Optical Center</text>
  <text x="56" y="150" fill="#007aff" font-family="Heebo, Arial, sans-serif" font-size="13" font-weight="600">гщбешг</text>
  <text x="56" y="186" fill="#5a6573" font-family="Heebo, Arial, sans-serif" font-size="13">ъчмеъ</text>
  <text x="56" y="222" fill="#5a6573" font-family="Heebo, Arial, sans-serif" font-size="13">ъйбъ геаш</text>
  <text x="56" y="258" fill="#5a6573" font-family="Heebo, Arial, sans-serif" font-size="13">срйфйн</text>
  <!-- main -->
  <text x="292" y="72" fill="#1c2430" font-family="Heebo, Arial, sans-serif" font-size="26" font-weight="700">бечш иеб, йерй</text>
  <text x="292" y="100" fill="#5a6573" font-family="Heebo, Arial, sans-serif" font-size="13">од чешд тлщйе З од гешщ ийфем З од дцтг дба</text>
  <rect x="1220" y="48" width="176" height="44" rx="14" fill="#e11d2e"/>
  <text x="1308" y="76" text-anchor="middle" fill="#fff" font-family="Heebo, Arial, sans-serif" font-size="14" font-weight="600">ъчмд згщд</text>
  <!-- stats -->
  <g font-family="Heebo, Arial, sans-serif">
    <rect x="292" y="132" width="260" height="110" rx="20" fill="#fff" stroke="#ffe5e3" filter="url(#soft)"/>
    <text x="316" y="168" fill="#5a6573" font-size="12">зшйвеъ SLA</text>
    <text x="316" y="212" fill="#ff3b30" font-size="36" font-weight="700">4</text>
    <rect x="568" y="132" width="260" height="110" rx="20" fill="#fff" stroke="#fff4e0" filter="url(#soft)"/>
    <text x="592" y="168" fill="#5a6573" font-size="12">мма азшай</text>
    <text x="592" y="212" fill="#ff9f0a" font-size="36" font-weight="700">7</text>
    <rect x="844" y="132" width="260" height="110" rx="20" fill="#fff" stroke="#e5f1ff" filter="url(#soft)"/>
    <text x="868" y="168" fill="#5a6573" font-size="12">бийфем</text>
    <text x="868" y="212" fill="#007aff" font-size="36" font-weight="700">18</text>
    <rect x="1120" y="132" width="276" height="110" rx="20" fill="#fff" stroke="#e6f8eb" filter="url(#soft)"/>
    <text x="1144" y="168" fill="#5a6573" font-size="12">рсвше дйен</text>
    <text x="1144" y="212" fill="#34c759" font-size="36" font-weight="700">11</text>
  </g>
  <!-- attention panel -->
  <rect x="292" y="268" width="1104" height="540" rx="24" fill="rgba(255,255,255,0.78)" stroke="#d7e0ea" filter="url(#soft)"/>
  <text x="320" y="312" fill="#1c2430" font-family="Heebo, Arial, sans-serif" font-size="15" font-weight="600">гешщ ъщеоъ мб</text>
  <g font-family="Heebo, Arial, sans-serif">
    <circle cx="336" cy="360" r="6" fill="#ff3b30"/>
    <text x="360" y="356" fill="#1c2430" font-size="14" font-weight="600">ожвп аемн ъцевд ма очшш</text>
    <text x="360" y="378" fill="#8491a1" font-size="12">гйжрвеу З #OC-1042</text>
    <rect x="1180" y="348" width="160" height="32" rx="16" fill="#ffe5e3"/>
    <text x="1260" y="369" text-anchor="middle" fill="#ff3b30" font-size="12" font-weight="600">SLA +2щѓ</text>

    <circle cx="336" cy="430" r="6" fill="#ff9f0a"/>
    <text x="360" y="426" fill="#1c2430" font-size="14" font-weight="600">ъаешъ ейишйрд лбейд</text>
    <text x="360" y="448" fill="#8491a1" font-size="12">шоъ абйб З #OC-1038</text>
    <rect x="1180" y="418" width="160" height="32" rx="16" fill="#fff4e0"/>
    <text x="1260" y="439" text-anchor="middle" fill="#ff9f0a" font-size="12" font-weight="600">SLA 40гѓ</text>

    <circle cx="336" cy="500" r="6" fill="#007aff"/>
    <text x="360" y="496" fill="#1c2430" font-size="14" font-weight="600">огфсъ чбмеъ  рййш ъчет</text>
    <text x="360" y="518" fill="#8491a1" font-size="12">ащгег З #OC-1031</text>
    <rect x="1180" y="488" width="160" height="32" rx="16" fill="#e5f1ff"/>
    <text x="1260" y="509" text-anchor="middle" fill="#007aff" font-size="12" font-weight="600">бийфем</text>

    <circle cx="336" cy="570" r="6" fill="#ff3b30"/>
    <text x="360" y="566" fill="#1c2430" font-size="14" font-weight="600">гмъ лрйсд ма рртмъ</text>
    <text x="360" y="588" fill="#8491a1" font-size="12">баш щбт З #OC-1029</text>
    <rect x="1180" y="558" width="160" height="32" rx="16" fill="#ffe5e3"/>
    <text x="1260" y="579" text-anchor="middle" fill="#ff3b30" font-size="12" font-weight="600">SLA +1щѓ</text>
  </g>
</svg>
