<!DOCTYPE html>
<html lang="he" dir="rtl">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>MILO · תצוגת אייפון</title>
    <style>
      :root {
        color-scheme: dark;
      }
      * {
        box-sizing: border-box;
      }
      html,
      body {
        margin: 0;
        height: 100%;
        background: #1c1917;
        font-family: system-ui, sans-serif;
      }
      body {
        display: grid;
        place-items: center;
        overflow: hidden;
      }
      .phone {
        width: 418px;
        height: 888px;
        padding: 14px;
        border-radius: 54px;
        background: #0c0a09;
        box-shadow:
          0 0 0 2px #292524,
          0 28px 80px rgba(0, 0, 0, 0.45);
        transform-origin: center center;
      }
      .screen {
        position: relative;
        width: 390px;
        height: 844px;
        overflow: hidden;
        border-radius: 40px;
        background: #faf7f2;
      }
      iframe {
        display: block;
        width: 390px;
        height: 844px;
        border: 0;
        background: #faf7f2;
      }
    </style>
  </head>
  <body>
    <div class="phone" id="phone">
      <div class="screen">
        <iframe
          id="app"
          title="MILO על מסך אייפון"
          src="/ops/dashboard"
        ></iframe>
      </div>
    </div>
    <script>
      const phone = document.getElementById('phone')
      const frame = document.getElementById('app')
      const params = new URLSearchParams(location.search)
      const start = params.get('path')
      if (start && start.startsWith('/') && !start.startsWith('//')) {
        frame.src = start
      }
      function fit() {
        const scale = Math.min(
          (window.innerWidth - 28) / 418,
          (window.innerHeight - 28) / 888,
          1.15,
        )
        phone.style.transform = 'scale(' + scale + ')'
      }
      window.addEventListener('resize', fit)
      fit()
    </script>
  </body>
</html>
