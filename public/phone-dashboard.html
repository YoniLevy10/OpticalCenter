<!DOCTYPE html>
<html lang="he" dir="rtl">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>MILO · תצוגת טלפון</title>
    <style>
      * { box-sizing: border-box; }
      html, body {
        margin: 0;
        height: 100%;
        background: #e8e8ed;
        font-family: "Segoe UI", system-ui, sans-serif;
      }
      body {
        height: 100%;
        overflow: hidden;
        display: grid;
        place-items: center;
        padding: 16px;
      }
      .stage {
        text-align: center;
        height: 100%;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 10px;
      }
      .label {
        margin: 0;
        color: #3a3a3c;
        font-size: 13px;
        letter-spacing: 0.01em;
      }
      .slot {
        position: relative;
        width: 402px;
        height: 856px;
      }
      .phone {
        position: absolute;
        top: 0;
        left: 50%;
        width: 402px;
        height: 856px;
        margin-left: -201px;
        padding: 12px;
        border-radius: 44px;
        background: #1c1c1e;
        transform-origin: top center;
        box-shadow:
          inset 0 0 0 2px #3a3a3c,
          0 24px 60px rgba(0, 0, 0, 0.28);
      }
      .screen {
        width: 390px;
        height: 844px;
        overflow: hidden;
        border-radius: 34px;
        background: #f2f2f7;
      }
      iframe {
        display: block;
        width: 390px;
        height: 844px;
        border: 0;
        background: #f2f2f7;
      }
    </style>
  </head>
  <body>
    <div class="stage">
      <p class="label">דשבורד · שרת מקומי · 390×844</p>
      <div class="slot" id="slot">
      <div class="phone" id="phone">
        <div class="screen">
          <iframe
            title="דשבורד MILO בטלפון"
            src="/ops/dashboard"
          ></iframe>
        </div>
      </div>
      </div>
    </div>
    <script>
      const phone = document.getElementById('phone')
      const slot = document.getElementById('slot')
      function fit() {
        const scale = Math.min(1, (innerHeight - 72) / 856, (innerWidth - 48) / 402)
        phone.style.transform = 'scale(' + scale + ')'
        slot.style.width = (402 * scale) + 'px'
        slot.style.height = (856 * scale) + 'px'
      }
      fit()
      addEventListener('resize', fit)
    </script>
  </body>
</html>
